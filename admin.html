<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E Store Admin</title>
<style>
body{font-family:Arial;background:#f4f6f5;margin:0;color:#222}.head{background:#08783d;color:#fff;padding:18px 5%;display:flex;justify-content:space-between}.wrap{max-width:1250px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.box{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px #0001;margin-bottom:18px}.stat b{font-size:26px;color:#08783d}.tabs button,.btn{border:0;background:#08783d;color:#fff;padding:10px 16px;border-radius:7px;cursor:pointer;margin:4px}.danger{background:#c62828!important}input,select{padding:10px;border:1px solid #ddd;border-radius:7px;margin:4px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right}.login{max-width:450px;margin:60px auto}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}table{font-size:12px}}
</style></head><body><div class="head"><b>🛒 E Store Admin</b><span>Order & Product Management</span></div>
<div class="wrap" id="login"><div class="box login"><h2>Admin Login</h2><input id="key" type="password" placeholder="Admin Key" style="width:90%"><button class="btn" onclick="login()">Login</button></div></div>
<div class="wrap" id="app" style="display:none"><div class="cards"><div class="stat">Products<br><b id="sProducts">0</b></div><div class="stat">Orders<br><b id="sOrders">0</b></div><div class="stat">Pending<br><b id="sPending">0</b></div><div class="stat">Completed Revenue<br><b id="sRevenue">Rs. 0</b></div></div>
<div class="tabs"><button onclick="orders()">Orders</button><button onclick="products()">Products</button><button onclick="addForm()">Add Product</button></div>
<div id="content"></div></div>
<script>
let K="";
const H=()=>({"x-admin-key":K,"Content-Type":"application/json"}),fmt=n=>Number(n).toLocaleString("en-PK");
async function login(){K=key.value;let r=await fetch("/api/admin/stats",{headers:H()});if(!r.ok)return alert("غلط Admin Key");document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";stats();orders()}
async function stats(){let s=await(await fetch("/api/admin/stats",{headers:H()})).json();sProducts.textContent=s.products;sOrders.textContent=s.orders;sPending.textContent=s.pending;sRevenue.textContent="Rs. "+fmt(s.revenue)}
async function orders(){let r=await fetch("/api/admin/orders",{headers:H()}),os=await r.json();content.innerHTML=`<div class="box"><h2>Orders</h2><table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th></tr>${os.map(o=>`<tr><td><b>${o.id}</b><br>${new Date(o.createdAt).toLocaleString()}</td><td>${o.customer.name}<br>${o.customer.phone}<br>${o.customer.address}</td><td>Rs. ${fmt(o.total)}<br>${o.paymentMethod}</td><td><select onchange="setStatus('${o.id}',this.value)">${["نیا آرڈر","تصدیق شدہ","پیک ہو رہا ہے","بھیج دیا گیا","مکمل","منسوخ"].map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table></div>`}
async function setStatus(id,status){await fetch("/api/admin/orders/"+id,{method:"PATCH",headers:H(),body:JSON.stringify({status})});stats();orders()}
async function products(){let ps=await(await fetch("/api/products")).json();content.innerHTML=`<div class="box"><h2>Products</h2><table><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th></tr>${ps.map(p=>`<tr><td>${p.name}</td><td>${p.category}</td><td>Rs. ${fmt(p.price)}</td><td>${p.stock}</td><td><button class="btn" onclick="edit(${p.id})">Edit</button><button class="btn danger" onclick="del(${p.id})">Hide</button></td></tr>`).join("")}</table></div>`}
function addForm(p={}){content.innerHTML=`<div class="box"><h2>${p.id?"Edit":"Add"} Product</h2><input id="pn" placeholder="نام" value="${p.name||""}"><input id="pc" placeholder="کیٹیگری" value="${p.category||""}"><input id="pp" type="number" placeholder="قیمت" value="${p.price||""}"><input id="po" type="number" placeholder="پرانی قیمت" value="${p.oldPrice||""}"><input id="ps" type="number" placeholder="اسٹاک" value="${p.stock||""}"><input id="pu" placeholder="یونٹ" value="${p.unit||""}"><input id="pi" placeholder="Image URL" value="${p.image||""}" style="width:80%"><br><button class="btn" onclick="save(${p.id||0})">Save</button></div>`}
async function edit(id){let p=await(await fetch("/api/products/"+id)).json();addForm(p)}
async function save(id){let b={name:pn.value,category:pc.value,price:+pp.value,oldPrice:+po.value,stock:+ps.value,unit:pu.value,image:pi.value};let u=id?"/api/admin/products/"+id:"/api/admin/products";let r=await fetch(u,{method:id?"PATCH":"POST",headers:H(),body:JSON.stringify(b)});if(!r.ok)return alert("Error");products();stats()}
async function del(id){if(!confirm("Hide product?"))return;await fetch("/api/admin/products/"+id,{method:"DELETE",headers:H()});products();stats()}
</script></body></html>
